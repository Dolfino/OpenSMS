name: CI/CD Pipeline - Build & Deploy to VPS K3s

on:
  push:
    branches:
      - main
    paths:
      - 'sms-platform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opensms-pulse

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🔨 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sms-platform
          file: ./sms-platform/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: 🚀 Deploy to VPS K3s via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Executar Deploy no K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "==> Iniciando atualização no K3s..."
            
            # Atualiza o deployment para usar a imagem do GHCR sempre atualizada
            kubectl set image deployment/opensms-pulse-app app=ghcr.io/dolfino/opensms-pulse:latest -n opensms-pulse
            
            # Força o rollout com a nova versão
            kubectl rollout restart deployment/opensms-pulse-app -n opensms-pulse
            
            # Aguarda o rollout completar sem downtime
            kubectl rollout status deployment/opensms-pulse-app -n opensms-pulse --timeout=90s
            
            echo "==> Deploy concluído com sucesso em https://sms.ideiasmkt.com.br!"
